[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-agent"
version = "0.1.0"
description = "AI-powered personal budget agent with SQLite"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.scripts]
budget-agent = "src.cli.main:main"

[tool.setuptools]
packages = ["src"]
